<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Triage Tycoon: Resident Life — Full Version</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --c-cyan: #22d3ee;
            --c-bg: #0f172a;
            --c-panel: rgba(30, 41, 59, 0.9);
        }

        body {
            margin: 0;
            background-color: #020617;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        #root {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .hud-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- CORE UTILITIES --- */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 12px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .neon-text {
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }

        /* --- ANIMATIONS --- */
        @keyframes slideInRight {
            from {
                transform: translateX(50px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .patient-enter {
            animation: slideInRight 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0));
            }

            15% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5));
            }

            30% {
                transform: scale(1);
                filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0));
            }

            45% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5));
            }

            60% {
                transform: scale(1);
                filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0));
            }
        }

        .critical-pulse {
            animation: heartbeat 2s infinite;
            color: #ef4444;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.95);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .pop-in,
        .anim-pop {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-4px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(4px);
            }
        }

        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes floatAlert {
            0% {
                opacity: 0;
                transform: translate(-50%, 20px);
            }

            10% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            90% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        .alert-float {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--c-cyan);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            z-index: 9999;
            text-align: center;
            white-space: nowrap;
            animation: floatAlert 1.8s forwards;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            font-weight: 700;
        }

        /* --- BACKGROUND --- */
        .game-background {
            background:
                radial-gradient(circle at 50% 0%, rgba(45, 212, 191, 0.1), transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(244, 63, 94, 0.05), transparent 40%),
                #020617;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .game-background::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .game-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(2, 6, 23, 0.8) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- BUTTONS --- */
        .btn-premium {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%), var(--btn-bg);
            border: 1px solid var(--btn-border);
            box-shadow: 0 4px 0 var(--btn-shadow), 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: all 0.1s;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-premium:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--btn-shadow);
        }

        .btn-premium:disabled {
            opacity: 0.5;
            filter: grayscale(0.8);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-blue {
            --btn-bg: #2563eb;
            --btn-border: #60a5fa;
            --btn-shadow: #1e40af;
        }

        .btn-green {
            --btn-bg: #15803d;
            --btn-border: #4ade80;
            --btn-shadow: #14532d;
        }

        .btn-yellow {
            --btn-bg: #ca8a04;
            --btn-border: #facc15;
            --btn-shadow: #854d0e;
        }

        .btn-red {
            --btn-bg: #dc2626;
            --btn-border: #f87171;
            --btn-shadow: #991b1b;
        }

        .btn-slate {
            --btn-bg: #475569;
            --btn-border: #94a3b8;
            --btn-shadow: #334155;
        }

        .scroll-hide::-webkit-scrollbar {
            display: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 99px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.4);
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        /* ================================================================
           📦 DATOS COMPLETOS (BASE DE DATOS DE CASOS)
           ================================================================ */

        const NAMES = [
            "Sra. Carmen", "El Jony", "Don Pedro", "Luisa", "Marco", "Valeria", "Sofía",
            "Roberto", "Doña Tere", "Kevin", "Ángel", "Daniela", "Mauricio", "Beatriz",
            "Anahí", "Héctor", "Cynthia", "Teresa", "Miguel", "Laura", "Rocío", "Iván",
            "Claudia", "Felipe", "Eduardo", "Brenda", "Jazmín", "Luis", "Karina"
        ];

        const random = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

        /* 1. CASOS ALTA (8) */
        const CASES_ALTA = [
            { type: "ALTA", score: 80, sprite: "😖", diag: "Somatización leve", txt: ["Me duele todo desde que discutí con mi jefe."], vitals: ["FC 80 | TA 120/80 | Sat 99%"] },
            { type: "ALTA", score: 80, sprite: "😬", diag: "Ansiedad situacional", txt: ["Tengo entrevista mañana y no puedo dormir."], vitals: ["FC 92 | TA 130/80"] },
            { type: "ALTA", score: 80, sprite: "😴", diag: "Insomnio por estrés", txt: ["Tengo tres días sin dormir por tareas."], vitals: ["FC 78 | Pupilas normales"] },
            { type: "ALTA", score: 80, sprite: "😢", diag: "Duelo sin complicaciones", txt: ["No puedo dejar de llorar desde que falleció mi tía."], vitals: ["FC 72 | TA 118/76"] },
            { type: "ALTA", score: 80, sprite: "🤨", diag: "Simulación administrativa", txt: ["Solo necesito justificante para faltar al trabajo."], vitals: ["FC 70 | Sonríe al felicitar"] },
            { type: "ALTA", score: 80, sprite: "😕", diag: "Crisis adaptativa", txt: ["Estoy abrumado por mis deudas."], vitals: ["FC 85 | Sat 100%"] },
            { type: "ALTA", score: 80, sprite: "😤", diag: "Problema interpersonal", txt: ["Mi pareja me dejó en visto y me alteré."], vitals: ["FC 80 | Pupilas normales"] },
            { type: "ALTA", score: 80, sprite: "😟", diag: "Episodio ansioso leve", txt: ["Me mareé en el metro, pensé que me desmayaba."], vitals: ["FC 90 | Sat 100%"] }
        ];

        /* 2. CASOS OBS (10) */
        const CASES_OBS = [
            { type: "OBS", score: 120, sprite: "😰", diag: "Crisis de pánico", txt: ["Siento que voy a morir, ayúdeme."], vitals: ["FC 130 | Sat 99%"] },
            { type: "OBS", score: 120, sprite: "😶‍🌫️", diag: "Ataque disociativo", txt: ["Todo se siente irreal, floto fuera de mí."], vitals: ["FC 95 | Pupilas normales"] },
            { type: "OBS", score: 120, sprite: "🍃", diag: "Intoxicación cannabis", txt: ["Comí un brownie y escucho mis latidos."], vitals: ["FC 120 | TA 150/90"] },
            { type: "OBS", score: 120, sprite: "🍄", diag: "Intox. alucinógenos", txt: ["Los colores hablan más fuerte que tú."], vitals: ["FC 110 | Pupilas dilatadas"] },
            { type: "OBS", score: 120, sprite: "🍺", diag: "Alcoholización aguda", txt: ["Vine porque mi ex está aquí… creo."], vitals: ["FC 100 | Aliento etílico +"] },
            { type: "OBS", score: 120, sprite: "😞", diag: "Ideación suicida leve", txt: ["A veces pienso que no vale la pena."], vitals: ["FC 80 | Sat 100%"] },
            { type: "OBS", score: 120, sprite: "👁️", diag: "Psicosis breve", txt: ["El vecino me observa por el enchufe."], vitals: ["FC 90 | TA 130/80"] },
            { type: "OBS", score: 120, sprite: "😤", diag: "Hiperventilación", txt: ["Mis manos se entumen, siento que me voy."], vitals: ["FC 140 | PaCO2 bajo"] },
            { type: "OBS", score: 120, sprite: "😡", diag: "Agitación leve", txt: ["Si me dicen que me calme, voy a explotar."], vitals: ["FC 100 | Pupilas normales"] },
            { type: "OBS", score: 120, sprite: "⚡", diag: "Reacción estrés agudo", txt: ["Choqué hace una hora, sigo temblando."], vitals: ["FC 115 | TA 145/90"] }
        ];

        /* 3. CASOS UCE (10) */
        const CASES_UCE = [
            { type: "UCE", score: 200, sprite: "👹", diag: "Psicosis aguda", txt: ["El demonio me ordenó venir a matarlos."], vitals: ["FC 120 | TA 150/95"] },
            { type: "UCE", score: 200, sprite: "💸", diag: "Manía (Gastos)", txt: ["¡Compro el hospital! ¿Cuánto cuesta?"], vitals: ["FC 115 | Pupilas dilatadas"] },
            { type: "UCE", score: 200, sprite: "🔪", diag: "Riesgo suicida alto", txt: ["Guardé las pastillas para tomarlas hoy."], vitals: ["FC 105 | Diaforesis +"] },
            { type: "UCE", score: 200, sprite: "🌑", diag: "Depresión psicótica", txt: ["Mi alma ya no existe, estoy muerto."], vitals: ["FC 90 | Sat 100%"] },
            { type: "UCE", score: 200, sprite: "💥", diag: "Agitación Metanfetamina", txt: ["¡No me toquen! ¡Soy invencible!"], vitals: ["FC 150 | TA 170/110 | Pup 6mm"] },
            { type: "UCE", score: 200, sprite: "🛰️", diag: "Psicosis paranoide", txt: ["Hay drones siguiéndome desde ayer."], vitals: ["FC 110 | TA 140/85"] },
            { type: "UCE", score: 200, sprite: "🥊", diag: "Riesgo heteroagresivo", txt: ["Si se acerca ese doctor, lo reviento."], vitals: ["FC 130 | Rigidez muscular"] },
            { type: "UCE", score: 200, sprite: "🩸", diag: "Intento suicida reciente", txt: ["Solo quería dejar de sentir."], vitals: ["FC 110 | TA 100/60 | Piel fría"] },
            { type: "UCE", score: 200, sprite: "📡", diag: "Delirios intensos", txt: ["Mi familia fue reemplazada por dobles."], vitals: ["FC 100 | Pupilas normales"] },
            { type: "UCE", score: 200, sprite: "💊", diag: "Abstinencia Benzos", txt: ["Tengo tres días sin mi clonazepam."], vitals: ["FC 125 | TA 155/95 | Temblor ++"] }
        ];

        /* 4. TRAMPAS (6) */
        const CASES_TRAMPA = [
            { type: "TRAP", real: "OBS", score: 150, sprite: "🥴", diag: "Hipoglucemia", txt: ["Se me olvidó comer, visión borrosa."], vitals: ["Glu 42 mg/dL | TA 100/60"] },
            { type: "TRAP", real: "UCE", score: 150, sprite: "🤒", diag: "Delirium Febril", txt: ["Me siento confundido y muy caliente."], vitals: ["Temp 39.1°C | FC 120"] },
            { type: "TRAP", real: "UCE", score: 150, sprite: "💀", diag: "Intox. Opioides", txt: ["(No responde, balbucea)"], vitals: ["FR 7 rpm | Pupilas puntiformes"] },
            { type: "TRAP", real: "OBS", score: 150, sprite: "🧩", diag: "Encefalopatía HTA", txt: ["Todo está borroso, me duele la cabeza."], vitals: ["TA 210/120 | FC 105"] },
            { type: "TRAP", real: "UCE", score: 150, sprite: "🫁", diag: "Hipoxia / Neumonía", txt: ["No sé dónde estoy, la tele me grita."], vitals: ["Temp 38.3°C | Sat 88%"] },
            { type: "TRAP", real: "OBS", score: 150, sprite: "🚽", diag: "Globo Vesical", txt: ["¡Me quiero arrancar los pantalones!"], vitals: ["Abd distendido | FC 120"] }
        ];

        /* NIVELES DE JUEGO */
        const LEVELS = [
            { id: 1, name: "Guardia 1: La Era de la Maruchan", duration: 60, spawnRate: 4200, beds: 3, uce: 0, goal: 300, meal: "Sopa instantánea con jamón" },
            { id: 2, name: "Guardia 2: El Sueño de la Torta", duration: 75, spawnRate: 3800, beds: 3, uce: 2, goal: 600, meal: "Torta de puesto (cubana)" },
            { id: 3, name: "Guardia 3: Trampas Clínicas", duration: 90, spawnRate: 3400, beds: 3, uce: 2, goal: 900, meal: "Tacos al Pastor (5 con todo)" },
            { id: 4, name: "Guardia 4: Caos Hospitalario", duration: 100, spawnRate: 3000, beds: 4, uce: 3, goal: 1300, meal: "Pizza Gigante Caliente" },
            { id: 5, name: "Final: Código Negro", duration: 110, spawnRate: 2500, beds: 4, uce: 4, goal: 1800, meal: "Sushi Deluxe & Sake" },
        ];

        function generatePatient(levelId) {
            let pool = [...CASES_ALTA, ...CASES_OBS];
            if (levelId >= 2) pool = [...pool, ...CASES_UCE];
            if (levelId >= 3) pool = [...pool, ...CASES_TRAMPA];

            const base = random(pool);

            return {
                id: Date.now() + Math.random(),
                name: random(NAMES),
                age: randint(18, 75),
                type: base.type,
                real: base.real || null,
                diag: base.diag,
                score: base.score,
                sprite: base.sprite,
                complaint: random(base.txt),
                vitals: random(base.vitals)
            };
        }

        /* ================================================================
           🎨 COMPONENTES VISUALES
           ================================================================ */
        const { useState, useEffect } = React;

        function getMealEmoji(mealName) {
            switch (mealName) {
                case "Sopa instantánea con jamón": return "🍜";
                case "Torta de puesto (cubana)": return "🥪";
                case "Tacos al Pastor (5 con todo)": return "🌮";
                case "Pizza Gigante Caliente": return "🍕";
                case "Sushi Deluxe & Sake": return "🍣";
                default: return "😋";
            }
        }

        function IntroScreen({ onStart }) {
            // ... (Mismo código de IntroScreen)
            return (
                <div className="h-full flex flex-col items-center justify-center p-6 text-center anim-pop">
                    <div className="text-6xl mb-4 animate-float">🏥</div>
                    <h1 className="text-4xl font-bold neon-text text-cyan-400 mb-2">TRIAGE TYCOON</h1>
                    <h2 className="text-lg text-blue-300 mb-6 tracking-widest hud-font">RESIDENTE EDITION</h2>

                    <div className="glass p-6 mb-8 max-w-sm text-left border-l-4 border-l-cyan-500">
                        <p className="mb-4 text-slate-300 leading-relaxed text-sm">
                            Bienvenido, <strong>Residente de 1er año</strong>.
                            Tu beca no ha llegado y tienes hambre. Tu única esperanza de cenar bien es hacer triages rápidos y precisos.
                        </p>
                        <div className="space-y-2 text-xs text-slate-400 hud-font">
                            <div className="flex items-center gap-2">
                                <span className="w-3 h-3 rounded-full bg-green-500"></span>
                                <strong>ALTA:</strong> Leves, somatización, quejosos.
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                                <strong>OBS:</strong> Urgencias reales pero estables.
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                                <strong>UCE:</strong> Peligro de vida o muy agresivos.
                            </div>
                        </div>
                    </div>

                    <button onClick={onStart} className="btn-premium btn-blue w-full py-4 text-xl">
                        INICIAR GUARDIA
                    </button>
                </div>
            );
        }

        function ReportScreen({ level, score, onNext }) {
            const success = score >= level.goal;

            return (
                <div className="absolute inset-0 z-50 bg-slate-900/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 anim-pop">
                    <h2 className="text-3xl font-bold neon-text mb-2 text-white">REPORTE DE GUARDIA</h2>
                    <div className="text-lg text-slate-400 mb-8">{level.name} Finalizado</div>

                    <div className="glass p-8 w-full max-w-xs mb-8">
                        <div className="flex justify-between mb-3 text-sm">
                            <span>Dinero acumulado:</span>
                            <span className={success ? "text-green-400 font-bold" : "text-red-400 font-bold"}>${score}</span>
                        </div>
                        <div className="flex justify-between mb-4 text-sm">
                            <span>Costo de la cena:</span>
                            <span className="text-yellow-400 font-bold">${level.goal}</span>
                        </div>
                        <div className="h-px bg-white/10 mb-4"></div>

                        <div className="text-center">
                            <div className="text-xs text-slate-500 uppercase tracking-widest mb-2">TU CENA HOY</div>
                            {success ? (
                                <div className="anim-pop">
                                    <div className="text-6xl mb-2">{getMealEmoji(level.meal)}</div>
                                    <div className="text-xl font-bold text-cyan-300">{level.meal}</div>
                                    <div className="text-xs text-green-400 mt-1">¡Te lo mereces, doc!</div>
                                </div>
                            ) : (
                                <div className="anim-pop">
                                    <div className="text-6xl mb-2">🦗</div>
                                    <div className="text-xl font-bold text-slate-500">Galletas saladas</div>
                                    <div className="text-xs text-red-400 mt-1">Inténtalo en la siguiente guardia...</div>
                                </div>
                            )}
                        </div>
                    </div>

                    <button onClick={onNext} className="btn-premium btn-green w-full max-w-xs py-3 text-lg">
                        {level.id === 5 ? "VER FINAL" : "SIGUIENTE GUARDIA ➡"}
                    </button>
                </div>
            );
        }

        function PatientCard({ p, onAssign }) {
            const borderColor = p.type === 'UCE' ? '#ef4444' : p.type === 'OBS' ? '#eab308' : '#22c55e';

            return (
                <div className="glass p-4 mb-3 patient-enter flex items-start gap-3 border-l-4 relative overflow-hidden"
                    style={{ borderColor: borderColor }}>

                    <div className="text-4xl pt-1 filter drop-shadow-md">{p.sprite}</div>

                    <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-center mb-1">
                            <strong className="text-lg text-white truncate">{p.name}, {p.age}a</strong>
                            <span className="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700">
                                #{String(Math.floor(p.id)).slice(-3)}
                            </span>
                        </div>

                        <div className="text-sm text-cyan-200 italic mb-2 leading-tight">"{p.complaint}"</div>

                        <div className="inline-block bg-slate-950/60 rounded px-2 py-1 text-xs text-slate-300 hud-font border border-white/5 mb-3">
                            {p.vitals}
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                            <button onClick={() => onAssign(p, 'ALTA')} className="btn-premium btn-green py-2 text-sm">ALTA</button>
                            <button onClick={() => onAssign(p, 'OBS')} className="btn-premium btn-yellow py-2 text-sm">OBS</button>
                            <button onClick={() => onAssign(p, 'UCE')} className="btn-premium btn-red py-2 text-sm">UCE</button>
                        </div>
                    </div>
                </div>
            );
        }

        function GameScreen({ levelData, onLevelComplete }) {
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(levelData.duration);
            const [waiting, setWaiting] = useState([]);
            const [bedsOBS, setBedsOBS] = useState(Array(levelData.beds).fill(null));
            const [bedsUCE, setBedsUCE] = useState(Array(levelData.uce).fill(null));
            const [alert, setAlert] = useState(null);

            // Timer Logic
            useEffect(() => {
                if (timeLeft <= 0) {
                    onLevelComplete(score);
                    return;
                }
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(timer);
            }, [timeLeft]);

            // Spawner Logic
            useEffect(() => {
                if (waiting.length === 0) setWaiting([generatePatient(levelData.id)]);

                const spawner = setInterval(() => {
                    if (waiting.length < 10) {
                        setWaiting(prev => [...prev, generatePatient(levelData.id)]);
                    }
                }, levelData.spawnRate);
                return () => clearInterval(spawner);
            }, [levelData, waiting.length]);

            function pushAlert(msg) {
                setAlert(null);
                setTimeout(() => setAlert(msg), 10);
            }

            function handleAssign(p, target) {
                let points = 0;
                let isTrap = (p.type === 'TRAP');
                let currentAlert = "";

                // 1. Lógica de Puntos y Mensaje
                if (isTrap) {
                    if (target === p.real) {
                        points = p.score + 50;
                        currentAlert = `🎯 ¡BIEN HECHO! Era ${p.diag} (Médico). (+${points})`;
                    } else {
                        points = -40;
                        currentAlert = `🚨 ¡FALLO CRÍTICO! Era ${p.diag} (Médico). (-${40})`;
                    }
                } else {
                    if (target === p.type) {
                        points = p.score;
                        if (target === 'ALTA') currentAlert = `🟢 ¡PERFECTO! Desalojo de sala. (+${points})`;
                        if (target === 'OBS') currentAlert = `🟡 ESTABILIZADO. Se queda en observación. (+${points})`;
                        if (target === 'UCE') currentAlert = `🔴 ¡SALVADO! Triage correcto a Choque. (+${points})`;
                    } else {
                        points = -20;
                        if (target === 'ALTA' && p.type === 'UCE') currentAlert = `¡ERROR! Paciente UCE enviado a casa. (-${20})`;
                        else if (target === 'OBS' && p.type === 'UCE') currentAlert = `¡CUIDADO! Es grave, OBS no basta. (-${20})`;
                        else if (target === 'UCE' && p.type === 'ALTA') currentAlert = `¡SOBRECARGA! Gasto de cama UCE innecesario. (-${20})`;
                        else currentAlert = `✖ Triage incorrecto. Revisar el cuadro clínico. (-${20})`;
                    }
                }

                // 2. Lógica de Camas (Solo si el destino es OBS o UCE)
                let isBedPenalty = false;
                if (target === 'OBS') {
                    const idx = bedsOBS.indexOf(null);
                    if (idx === -1) {
                        isBedPenalty = true;
                        points = -15;
                        currentAlert = `⚠ ¡OBS LLENO! (-15 pts) - No había dónde poner a ${p.name}.`;
                    } else {
                        let newBeds = [...bedsOBS]; newBeds[idx] = p; setBedsOBS(newBeds);
                        setTimeout(() => {
                            setBedsOBS(curr => { let c = [...curr]; if (c[idx] === p) c[idx] = null; return c; });
                        }, 5000);
                    }
                } else if (target === 'UCE') {
                    const idx = bedsUCE.indexOf(null);
                    if (idx === -1) {
                        isBedPenalty = true;
                        points = -15;
                        currentAlert = `⚠ ¡UCE LLENO! (-15 pts) - No había dónde poner a ${p.name}.`;
                    } else {
                        let newBeds = [...bedsUCE]; newBeds[idx] = p; setBedsUCE(newBeds);
                        setTimeout(() => {
                            setBedsUCE(curr => { let c = [...curr]; if (c[idx] === p) c[idx] = null; return c; });
                        }, 8000);
                    }
                }

                // Muestra la alerta, priorizando la de cama llena si aplica
                if (!isBedPenalty) {
                    pushAlert(currentAlert);
                } else if (isBedPenalty) {
                    pushAlert(currentAlert);
                }

                setScore(s => Math.max(0, s + points));
                setWaiting(prev => prev.filter(x => x.id !== p.id));
            }

            // Progreso visual
            const progressPercent = Math.min(100, (score / levelData.goal) * 100);

            return (
                <div className="flex flex-col h-full relative">
                    {/* Header / HUD */}
                    <div className="p-4 bg-slate-800/90 backdrop-blur border-b border-slate-700 shadow-xl z-20">
                        <div className="flex justify-between text-xs hud-font text-slate-400 mb-2 uppercase tracking-wide">
                            <span>{levelData.name}</span>
                            <span>Meta: ${levelData.goal}</span>
                        </div>

                        {/* Barra de Progreso */}
                        <div className="relative w-full h-5 bg-slate-950 rounded-full overflow-hidden border border-slate-600 mb-2 shadow-inner">
                            <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-600 via-cyan-400 to-emerald-400 transition-all duration-500 ease-out"
                                style={{ width: `${progressPercent}%` }}></div>
                            <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white shadow-black drop-shadow-md">
                                {levelData.meal}
                            </div>
                        </div>

                        <div className="flex justify-between items-end mt-1">
                            <div className="text-4xl font-bold text-white neon-text leading-none">${score}</div>
                            <div className={`text-2xl hud-font font-bold leading-none ${timeLeft < 15 ? 'text-red-500 animate-pulse' : 'text-slate-200'}`}>
                                00:{String(timeLeft).padStart(2, '0')}
                            </div>
                        </div>
                    </div>

                    {/* Alerta Flotante */}
                    {alert && <div className="alert-float text-white font-bold text-sm">{alert}</div>}

                    {/* Área Scrollable */}
                    <div className="flex-1 overflow-y-auto p-3 scroll-hide pb-24">

                        {/* Pacientes en Espera */}
                        <div className="mb-6">
                            <div className="flex items-center gap-2 mb-3">
                                <div className="h-2 w-2 rounded-full bg-green-500 animate-ping"></div>
                                <h3 className="text-slate-400 text-xs font-bold tracking-widest uppercase">Sala de Espera ({waiting.length})</h3>
                            </div>

                            {waiting.length === 0 && (
                                <div className="text-center py-10 opacity-30">
                                    <div className="text-4xl mb-2">☕</div>
                                    <p>Sala vacía... por ahora.</p>
                                </div>
                            )}

                            {waiting.map(p => (
                                <PatientCard key={p.id} p={p} onAssign={handleAssign} />
                            ))}
                        </div>

                        {/* Camas Visuales */}
                        <div className="grid grid-cols-2 gap-4 pb-4">
                            <div className="glass p-2 border-t-2 border-t-yellow-500">
                                <h3 className="text-yellow-500 text-[10px] font-bold uppercase mb-2 text-center">Observación</h3>
                                <div className="space-y-2">
                                    {bedsOBS.map((b, i) => (
                                        <div key={i} className={`h-10 rounded border flex items-center justify-center text-lg transition-all ${b ? 'bg-yellow-900/40 border-yellow-500 text-white' : 'bg-slate-800/30 border-dashed border-slate-700 text-slate-600'}`}>
                                            {b ? b.sprite : <span className="text-[10px]">LIBRE</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="glass p-2 border-t-2 border-t-red-500">
                                <h3 className="text-red-500 text-[10px] font-bold uppercase mb-2 text-center">Choque / UCE</h3>
                                <div className="space-y-2">
                                    {bedsUCE.map((b, i) => (
                                        <div key={i} className={`h-10 rounded border flex items-center justify-center text-lg transition-all ${b ? 'bg-red-900/40 border-red-500 text-white' : 'bg-slate-800/30 border-dashed border-slate-700 text-slate-600'}`}>
                                            {b ? b.sprite : <span className="text-[10px]">LIBRE</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ================================================================
           🚀 MAIN APP CONTROLLER
           ================================================================ */

        function App() {
            const [phase, setPhase] = useState('INTRO'); // INTRO, GAME, REPORT, END
            const [levelIndex, setLevelIndex] = useState(0);
            const [lastScore, setLastScore] = useState(0);

            const startLevel = () => setPhase('GAME');

            const handleLevelComplete = (finalScore) => {
                setLastScore(finalScore);
                setPhase('REPORT');
            };

            const nextLevel = () => {
                if (levelIndex + 1 >= LEVELS.length) {
                    setPhase('END');
                } else {
                    setLevelIndex(prev => prev + 1);
                    setPhase('GAME');
                }
            };

            return (

                <div className="h-full w-full max-w-md mx-auto relative shadow-2xl overflow-hidden glass-panel">
                    <div className="game-background"></div>
                    {phase === 'INTRO' && (
                        <IntroScreen onStart={startLevel} />
                    )}

                    {phase === 'GAME' && (
                        <GameScreen
                            key={levelIndex}
                            levelData={LEVELS[levelIndex]}
                            onLevelComplete={handleLevelComplete}
                        />
                    )}

                    {phase === 'REPORT' && (
                        <ReportScreen
                            level={LEVELS[levelIndex]}
                            score={lastScore}
                            onNext={nextLevel}
                        />
                    )}

                    {phase === 'END' && (
                        <div className="h-full flex flex-col items-center justify-center p-6 text-center anim-pop">
                            <div className="text-6xl mb-6 animate-bounce">🎓</div>
                            <h1 className="text-3xl font-bold neon-text text-purple-400 mb-4">¡RESIDENCIA COMPLETADA!</h1>
                            <p className="mb-8 text-slate-300">
                                Has sobrevivido a todas las guardias, alimentado tu cuerpo y mantenido tu cordura (casi).
                            </p>
                            <div className="glass p-4 mb-8 w-full">
                                <p className="text-cyan-300 hud-font text-sm">Próxima meta: <br />Sobrevivir al R2.</p>
                            </div>
                            <button onClick={() => window.location.reload()} className="btn-premium btn-slate w-full py-3">
                                VOLVER A JUGAR
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

    </script>
</body>

</html>
